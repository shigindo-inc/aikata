    - path: docs/adoption.md
      title: Adopting aikata in an existing repository
      summary: 'aikata is happiest in a greenfield directory: `aikata init` writes a coherent set of files and `.aikata/aikata.yaml` + `.aikata/manifest.yaml` record what it did. Real projects, though, often already have an `AGENTS.md`, a hand-written `CLAUDE.md`, a `.cursor/rules/` directory, or a `.gitignore` that does important work for the team. This guide covers the recommended migration paths so an existing repository can adopt aikata without losing user content.'
      status: draft
      updated: "2026-05-29"
      managed: false
      links:
