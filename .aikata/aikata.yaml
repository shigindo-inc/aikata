version: 2
project:
    name: aikata
    lang: en
    description: Lightweight CLI that scaffolds AI-readable markdown documents.
ai_tools:
    - claude
    - cursor
    - codex
components:
    memory: false
    ui: false
    api: false
    tdd: false
    changelog: false
    monorepo: false
features:
    obsidian_hints: false
docs:
    # aikata's own repo commits its generated artifacts (CLAUDE.md,
    # .cursor/rules/, ...) so contributors can open the repo with Claude
    # Code / Cursor without first installing aikata. See ADR 0003
    # §"Consequences". The generated paths are simply kept out of the
    # managed `.gitignore` block here; the removed `generate_gitignore`
    # flag (ADR 0025 D3) is no longer part of the schema.
    task_file_location: docs/tasks/current.md
