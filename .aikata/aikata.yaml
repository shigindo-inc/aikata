version: 2
project:
    name: aikata
    lang: en
    description: Lightweight CLI that scaffolds AI-readable markdown documents.
ai_tools:
    - claude
    - cursor
    - codex
components:
    memory: false
    ui: false
    api: false
    tdd: false
    changelog: false
    monorepo: false
features:
    obsidian_hints: false
docs:
    # aikata's own repo overrides the target-project default and
    # commits generated artifacts (CLAUDE.md, .cursor/rules/, ...) so
    # contributors can open the repo with Claude Code / Cursor without
    # first installing aikata. See ADR 0003 §"Consequences".
    generate_gitignore: false
    task_file_location: docs/tasks/current.md
