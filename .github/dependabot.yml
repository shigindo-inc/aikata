version: 2
updates:
  # Keep the SHA-pinned GitHub Actions (v0.8.1 onward) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Track Go module updates (cobra, gopkg.in/yaml.v3, and transitive deps).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
