# Release workflow for aikata.
#
# Triggered by a `v*` tag push (e.g. `git tag -a v0.1.0 -m "..."`
# followed by `git push origin v0.1.0`). GoReleaser builds the cross-
# platform binaries described in `.goreleaser.yml`, generates an SBOM
# per archive (syft), signs checksums.txt with keyless cosign, and
# uploads everything as a GitHub Release.
#
# Security notes:
#   - No untrusted event fields are interpolated into any `run:` step.
#   - `id-token: write` mints a short-lived OIDC token so cosign can
#     sign keylessly (no long-lived signing key). `contents: write`
#     lets GoReleaser create the release.
#   - Third-party actions are pinned to full commit SHAs (Dependabot
#     keeps them current). See ADR 0023.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser inspects git history (tags, changelog, etc.)
          # and refuses to run on a shallow clone.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Package agent distribution assets
        run: sh scripts/package-distribution-assets.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
