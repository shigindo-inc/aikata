# CI for aikata.
#
# Scope (Phase 2): Linux + Go 1.21 only. The multi-OS matrix
# (macOS, Linux, Windows x Go 1.21+) lands in Task 8 (release prep);
# see ROADMAP.md.
#
# Security note: this workflow does not interpolate any untrusted
# event fields (issue / PR title, commit message, branch name, etc.)
# into shell commands. Every `run:` step uses static commands only.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test + lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2

      - name: Build
        run: go build -o aikata ./cmd/aikata

      - name: Smoke test --version
        run: ./aikata --version
