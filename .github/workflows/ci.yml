# CI for aikata.
#
# Scope (Task 8 onward): macOS + Linux + Windows on Go 1.21. The
# golden tree assumes LF line endings — see .gitattributes for the
# normalization that keeps the Windows runner byte-identical.
#
# Security note: this workflow does not interpolate any untrusted
# event fields (issue / PR title, commit message, branch name, etc.)
# into shell commands. Every `run:` step uses static commands only.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  distribution-assets:
    name: distribution asset packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Package agent distribution assets
        run: sh scripts/package-distribution-assets.sh

      - name: Check archive contents
        # All three first-party skills (manage-docs, track-context,
        # refresh-docs) ship in each archive under a per-skill directory
        # (ADR 0043).
        run: |
          tar -tzf dist/aikata-universal-skill.tar.gz | grep -Fx 'universal-skill/manage-docs/SKILL.md'
          tar -tzf dist/aikata-universal-skill.tar.gz | grep -Fx 'universal-skill/manage-docs/agents/openai.yaml'
          tar -tzf dist/aikata-universal-skill.tar.gz | grep -Fx 'universal-skill/track-context/SKILL.md'
          tar -tzf dist/aikata-universal-skill.tar.gz | grep -Fx 'universal-skill/track-context/agents/openai.yaml'
          tar -tzf dist/aikata-universal-skill.tar.gz | grep -Fx 'universal-skill/refresh-docs/SKILL.md'
          tar -tzf dist/aikata-universal-skill.tar.gz | grep -Fx 'universal-skill/refresh-docs/agents/openai.yaml'
          tar -tzf dist/aikata-codex-plugin.tar.gz | grep -Fx 'plugin/.codex-plugin/plugin.json'
          tar -tzf dist/aikata-codex-plugin.tar.gz | grep -Fx 'plugin/skills/manage-docs/SKILL.md'
          tar -tzf dist/aikata-codex-plugin.tar.gz | grep -Fx 'plugin/skills/manage-docs/agents/openai.yaml'
          tar -tzf dist/aikata-codex-plugin.tar.gz | grep -Fx 'plugin/skills/track-context/SKILL.md'
          tar -tzf dist/aikata-codex-plugin.tar.gz | grep -Fx 'plugin/skills/track-context/agents/openai.yaml'
          tar -tzf dist/aikata-codex-plugin.tar.gz | grep -Fx 'plugin/skills/refresh-docs/SKILL.md'
          tar -tzf dist/aikata-codex-plugin.tar.gz | grep -Fx 'plugin/skills/refresh-docs/agents/openai.yaml'

  test:
    name: test + lint + build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.21"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        # Skip on Windows: line-ending normalization can produce
        # cosmetic go.sum diffs the matrix shouldn't fail on. The
        # ubuntu / macos legs already enforce tidiness.
        if: runner.os != 'Windows'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Lint
        # golangci-lint-action only runs on Linux; matrix lint would be
        # redundant since the linters are not OS-specific.
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: go build -o aikata ./cmd/aikata

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -o aikata.exe ./cmd/aikata

      - name: Smoke test --version (Unix)
        if: runner.os != 'Windows'
        run: ./aikata --version

      - name: Smoke test --version (Windows)
        if: runner.os == 'Windows'
        run: .\aikata.exe --version

      - name: aikata doctor (self-check, Unix)
        if: runner.os != 'Windows'
        # --strict turns warnings into errors so the v0.5+ dogfood
        # gate (ROADMAP: "zero errors and zero warnings on the aikata
        # repository at the release commit") is binding rather than
        # advisory. Errors continue to exit 3; warnings now also do.
        # --all-markdown keeps the gate validating every Markdown file
        # (the repo has no manifest, so the v0.9.7 managed-surface
        # default would otherwise skip docs/decisions, CONTRIBUTING.md,
        # SECURITY.md, etc.). See ADR 0037 D1.
        run: ./aikata doctor --all-markdown --strict

      - name: aikata doctor (self-check, Windows)
        if: runner.os == 'Windows'
        run: .\aikata.exe doctor --all-markdown --strict

      - name: aikata generate is byte-identical (Unix)
        if: runner.os != 'Windows'
        # v0.5+ dogfood gate: regenerating CLAUDE.md and the Cursor
        # rule must not produce a diff against the committed
        # artifacts. Any drift means AGENTS.md changed without
        # rerunning `aikata generate` — block the merge.
        run: |
          ./aikata generate
          git diff --exit-code -- CLAUDE.md .cursor/rules/main.mdc

  install-script:
    # Smoke-test scripts/install.sh against a known existing release.
    # Pinning AIKATA_VERSION avoids the unauthenticated GitHub API
    # rate limit and keeps the test deterministic. Bump the pin to
    # the latest release whenever a new tag ships.
    #
    # Security note: no untrusted event fields are interpolated. The
    # only env values are a static version string and a path derived
    # from $HOME on the runner.
    name: install script smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      AIKATA_VERSION: v0.8.1
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run install.sh
        run: |
          export AIKATA_INSTALL_DIR="$HOME/.aikata-bin"
          sh scripts/install.sh

      - name: Smoke test --version
        run: |
          "$HOME/.aikata-bin/aikata" --version

  goreleaser-check:
    # Validate .goreleaser.yml on every PR. The release workflow only
    # runs on a `v*` tag push, so a config error (bad signs/sboms block,
    # typo) would otherwise surface only at release time, which is too
    # late. `goreleaser check` catches it here.
    name: goreleaser config check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check .goreleaser.yml
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
