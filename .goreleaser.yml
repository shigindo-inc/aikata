# GoReleaser config — see https://goreleaser.com for full schema.
# Triggered by the `release` GitHub Actions workflow on `v*` tags.
version: 2

project_name: aikata

# Write GoReleaser's build output to a private directory rather than
# ./dist so the human-curated dist/ tree (Claude Code skill, future
# plugin payloads) is not wiped by `release --clean`.
dist: .goreleaser-output

before:
  hooks:
    - go mod tidy

builds:
  - id: aikata
    main: ./cmd/aikata
    binary: aikata
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No Windows ARM64 build: aikata has no Windows ARM64 users in
      # v0.1 and the toolchain support story is still maturing.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # Inject the v-prefixed tag so the binary's --version output
      # matches `go install` (which reports the v-prefixed module
      # version via debug.ReadBuildInfo). normalizeVersion in
      # cmd/aikata/main.go also guards this defensively.
      - -X main.version=v{{ .Version }}

archives:
  - id: aikata
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Software Bill of Materials, one per archive, generated by syft (the
# GoReleaser default). The release workflow installs syft before
# invoking GoReleaser. Each .sbom.json is uploaded as a release asset.
sboms:
  - id: archive
    artifacts: archive

# Keyless signing of the checksum file with cosign via GitHub OIDC.
# Signing only checksums.txt is sufficient: it already lists the
# SHA-256 of every archive, so a verified checksum file transitively
# authenticates all artifacts. The release workflow grants
# `id-token: write` and installs cosign; no long-lived key exists.
#
# cosign v3 (installed by cosign-installer) defaults to the new bundle
# format: the separate --output-certificate / --output-signature flags
# are deprecated and ignored, so we emit a single Sigstore bundle
# (checksums.txt.sigstore.json) via --bundle. See ADR 0023 and the
# README "Verifying a release signature" section.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: shigindo-inc
    name: aikata
  draft: false
  prerelease: auto
  name_template: "aikata {{ .Tag }}"
  header: |
    aikata `{{ .Tag }}` — see [CHANGELOG.md](./CHANGELOG.md) for the
    full release notes.
  footer: |
    ---
    Released via [GoReleaser](https://goreleaser.com).
  # Ship the first-party skills alongside the binaries so users can grab
  # them directly from a release asset without cloning the repo.
  extra_files:
    - glob: dist/claude-code/skill/SKILL.md
      name_template: aikata-skill.md
    - glob: dist/universal-skill/SKILL.md
      name_template: aikata-universal-skill.md
